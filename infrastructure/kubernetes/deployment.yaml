apiVersion: apps/v1
kind: Deployment
metadata:
  name: inducore-gateway
  namespace: inducore-prod
  labels:
    app.kubernetes.io/name: inducore-gateway
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: inducore-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inducore-gateway
    spec:
      containers:
        - name: gateway
          image: inducore/api-gateway:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: inducore-secrets
            - configMapRef:
                name: inducore-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
